# main 브랜치를 GitHub Pages에 배포합니다.
# 한 번만 설정: Settings → Pages → Source를 "GitHub Actions"로,
# Settings → Secrets and variables → Actions → Variables에 PAGES_ENABLED=true 추가.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build single-file site
        run: |
          node tools/build.js
          mkdir -p _site
          cp dist/lantern-keeper.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
